<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大学生开题报告 - Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1E40AF;
            --accent: #F59E0B;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
            --background: #FFFFFF;
            --slide-width: 1280px;
            --slide-height: 720px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, sans-serif;
            background: #E5E7EB;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .slide {
            width: var(--slide-width);
            height: var(--slide-height);
            background: var(--background);
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.12);
        }

        /* 左侧蓝色边条 - 学院风 */
        .slide::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 12px;
            background: var(--primary);
        }

        /* 顶部装饰线 */
        .slide::after {
            content: "";
            position: absolute;
            top: 60px;
            left: 80px;
            width: 100px;
            height: 4px;
            background: var(--accent);
        }

        .content {
            position: absolute;
            left: 80px;
            right: 100px;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            background: rgba(30, 64, 175, 0.08);
            padding: 8px 16px;
            border-radius: 4px;
            margin-bottom: 32px;
            width: fit-content;
        }

        .title {
            font-size: 52px;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.2;
            letter-spacing: -1px;
            margin-bottom: 24px;
        }

        .subtitle {
            font-size: 18px;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.7;
            max-width: 600px;
        }

        .footer {
            position: absolute;
            left: 80px;
            right: 100px;
            bottom: 56px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #E5E7EB;
            padding-top: 20px;
        }

        .meta {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .school {
            font-size: 14px;
            font-weight: 500;
            color: var(--primary);
        }

        /* Hidden metadata for frontend */
        .preview-header { display: none; }
    </style>
</head>
<body>
    <div class="preview-header">
        <p>标签: 大学生开题报告</p>
        <div class="color-swatch" style="background-color: #1E40AF">#1E40AF</div>
        <div class="description">适用于毕业设计开题、课题研究报告等学术场合，规范清晰，学院风格</div>
    </div>

    <div class="slide">
        <div class="content">
            <div class="badge">演示文档</div>
            <h1 class="title">大学生开题报告</h1>
            <p class="subtitle">AI 智能生成的演示文稿预览 - 风格: 开题报告风格</p>
        </div>

        <div class="footer">
            <div class="meta">
                <span>汇报人：SlideCraft AI</span>
                <span>日期：2026年1月</span>
            </div>
            <div class="school">THESIS PROPOSAL</div>
        </div>
    </div>
</body>
</html>
