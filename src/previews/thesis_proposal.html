<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大学生开题报告 - Preview</title>
    <style>
        :root {
            --primary: #1E3A8A;
            /* Academic Blue */
            --primary-light: #3B82F6;
            --secondary: #1E40AF;
            --accent: #D97706;
            /* Amber/Gold */
            --text-main: #1F2937;
            --text-sub: #4B5563;
            --bg-page: #F3F4F6;

            --font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            --slide-width: 1280px;
            --slide-height: 720px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: var(--font-family);
            overflow: hidden;
        }

        .slide-container {
            width: var(--slide-width);
            height: var(--slide-height);
            background: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
        }

        /* =========================================
           Design Elements
           ========================================= */

        /* 1. Left Side colored bar */
        .left-bar {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 48px;
            background: linear-gradient(180deg, var(--primary) 0%, var(--secondary) 100%);
            z-index: 10;
        }

        /* 2. Top-Right decorative shape */
        .top-deco {
            position: absolute;
            top: -100px;
            right: -50px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* 3. Bottom-Right decorative lines */
        .bottom-deco {
            position: absolute;
            bottom: 40px;
            right: 40px;
            display: flex;
            gap: 8px;
            opacity: 0.2;
        }

        .deco-line {
            width: 4px;
            height: 80px;
            background: var(--primary);
            transform: skewX(-20deg);
        }

        /* =========================================
           Content Layout
           ========================================= */

        .content-wrapper {
            flex: 1;
            margin-left: 48px;
            /* Offset by left-bar */
            padding: 80px 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 5;
        }

        /* Header Area */
        .header-area {
            margin-bottom: 60px;
        }

        .university-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--accent);
        }

        .badge-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-family: serif;
        }

        .badge-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Title Area */
        .main-title {
            font-size: 56px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.25;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }

        .sub-title {
            font-size: 24px;
            color: var(--text-sub);
            font-weight: 400;
            line-height: 1.5;
            padding-left: 20px;
            border-left: 4px solid var(--primary-light);
        }

        /* Info Area (Grid) */
        .info-grid {
            margin-top: 80px;
            display: grid;
            grid-template-columns: auto auto;
            gap: 20px 60px;
            max-width: 800px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .info-label {
            font-size: 14px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 20px;
            color: var(--text-main);
            font-weight: 600;
        }
    </style>
    <!-- Preview Metadata for Frontend Extraction -->
    <div class="preview-header" style="display:none;">
        <p>标签: 大学生开题报告</p>
        <div class="color-swatch" style="background-color: #1E3A8A">#1E3A8A</div>
        <div class="description">专为大学生开题答辩设计，简洁清晰，强调逻辑与规范</div>
    </div>
</head>

<body>

    <div class="slide-container">
        <!-- Decor Elements -->
        <div class="left-bar"></div>
        <div class="top-deco"></div>
        <div class="bottom-deco">
            <div class="deco-line"></div>
            <div class="deco-line" style="height: 60px; margin-top: 20px;"></div>
            <div class="deco-line" style="height: 40px; margin-top: 40px;"></div>
        </div>

        <!-- Main Content -->
        <div class="content-wrapper">

            <div class="header-area">
                <div class="university-badge">
                    <div class="badge-icon">U</div>
                    <span class="badge-text">2026届本科毕业论文开题报告</span>
                </div>
            </div>

            <div class="main-title">
                基于深度学习的自然语言处理<br>关键技术研究与应用
            </div>

            <div class="sub-title">
                Research on Key Technologies of Natural Language Processing based on Deep Learning
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">学生姓名 / Student</span>
                    <span class="info-value">张三 (Zhang San)</span>
                </div>
                <div class="info-item">
                    <span class="info-label">指导教师 / Supervisor</span>
                    <span class="info-value">李四 教授 (Prof. Li Si)</span>
                </div>
                <div class="info-item">
                    <span class="info-label">所在院系 / Department</span>
                    <span class="info-value">计算机科学与技术学院</span>
                </div>
                <div class="info-item">
                    <span class="info-label">日期 / Date</span>
                    <span class="info-value">2026年1月</span>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
