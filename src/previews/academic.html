<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学术研究/答辩 - Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1E3A5F;
            --accent: #8B0000;
            --text-primary: #2C3E50;
            --text-secondary: #7F8C8D;
            --background: #FEFEFE;
            --slide-width: 1280px;
            --slide-height: 720px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans SC', serif;
            background: #E8E8E8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .slide {
            width: var(--slide-width);
            height: var(--slide-height);
            background: var(--background);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
        }

        /* 经典双线边框 - 学术感 */
        .slide::before {
            content: "";
            position: absolute;
            inset: 24px;
            border: 2px solid var(--primary);
            pointer-events: none;
        }

        .slide::after {
            content: "";
            position: absolute;
            inset: 32px;
            border: 1px solid rgba(30, 58, 95, 0.3);
            pointer-events: none;
        }

        .content {
            position: absolute;
            inset: 80px 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .category {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 4px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 40px;
            padding-bottom: 16px;
            border-bottom: 1px solid #DDD;
        }

        .title {
            font-family: 'Noto Serif SC', serif;
            font-size: 52px;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.25;
            margin-bottom: 32px;
            max-width: 800px;
        }

        .subtitle {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 18px;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.7;
            max-width: 600px;
            font-style: italic;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: var(--accent);
            margin: 40px 0;
        }

        .footer {
            position: absolute;
            left: 100px;
            right: 100px;
            bottom: 56px;
            display: flex;
            justify-content: center;
            gap: 48px;
        }

        .footer-item {
            font-family: 'Noto Serif SC', serif;
            font-size: 15px;
            color: var(--text-secondary);
        }

        /* Hidden metadata for frontend */
        .preview-header { display: none; }
    </style>
</head>
<body>
    <div class="preview-header">
        <p>标签: 学术研究/答辩</p>
        <div class="color-swatch" style="background-color: #1E3A5F">#1E3A5F</div>
        <div class="description">适用于学术报告、论文答辩、研究分享等场合，简洁清晰，注重内容</div>
    </div>

    <div class="slide">
        <div class="content">
            <div class="category">演示文档</div>
            <h1 class="title">学术研究/答辩</h1>
            <div class="divider"></div>
            <p class="subtitle">AI 智能生成的演示文稿预览 - 风格: 学术研究风格</p>
        </div>

        <div class="footer">
            <div class="footer-item">汇报人：SlideCraft AI</div>
            <div class="footer-item">日期：2026年1月</div>
        </div>
    </div>
</body>
</html>
