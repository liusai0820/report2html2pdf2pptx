<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创意/营销 - Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1A1A2E;
            --accent-1: #E94560;
            --accent-2: #0F3460;
            --text-primary: #1A1A2E;
            --text-secondary: #6B7280;
            --background: #FFFFFF;
            --slide-width: 1280px;
            --slide-height: 720px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, sans-serif;
            background: #E5E5E5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .slide {
            width: var(--slide-width);
            height: var(--slide-height);
            background: var(--background);
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 100px rgba(0,0,0,0.18);
        }

        /* 大胆的对角色块 - 创意感 */
        .diagonal-block {
            position: absolute;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: var(--accent-1);
            transform: rotate(45deg);
            opacity: 0.9;
        }

        .diagonal-block-2 {
            position: absolute;
            top: -280px;
            right: -280px;
            width: 600px;
            height: 600px;
            background: var(--accent-2);
            transform: rotate(45deg);
            opacity: 0.3;
        }

        .content {
            position: absolute;
            left: 100px;
            right: 350px;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent-1);
            text-transform: uppercase;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .label::before {
            content: "●";
            font-size: 10px;
        }

        .title {
            font-size: 60px;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: 28px;
        }

        .subtitle {
            font-size: 19px;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.7;
            max-width: 500px;
        }

        .footer {
            position: absolute;
            left: 100px;
            bottom: 56px;
            display: flex;
            gap: 40px;
        }

        .footer-item {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* 右下角装饰文字 */
        .corner-text {
            position: absolute;
            right: 60px;
            bottom: 56px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.8);
            writing-mode: vertical-rl;
        }

        /* Hidden metadata for frontend */
        .preview-header { display: none; }
    </style>
</head>
<body>
    <div class="preview-header">
        <p>标签: 创意/营销</p>
        <div class="color-swatch" style="background-color: #E94560">#E94560</div>
        <div class="description">适用于品牌推广、营销方案、创意提案等场合，大胆活泼，视觉冲击力强</div>
    </div>

    <div class="slide">
        <div class="diagonal-block-2"></div>
        <div class="diagonal-block"></div>

        <div class="content">
            <div class="label">演示文档</div>
            <h1 class="title">创意/营销</h1>
            <p class="subtitle">AI 智能生成的演示文稿预览 - 风格: 创意营销风格</p>
        </div>

        <div class="footer">
            <div class="footer-item">汇报人：SlideCraft AI</div>
            <div class="footer-item">日期：2026年1月</div>
        </div>

        <div class="corner-text">CREATIVE</div>
    </div>
</body>
</html>
