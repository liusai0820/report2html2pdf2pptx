<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>咨询研究/汇报 - Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0A1628;
            --primary-light: #1E3A5F;
            --accent: #C9A227;
            --text-primary: #1A1A1A;
            --text-secondary: #6B7280;
            --background: #FFFFFF;
            --slide-width: 1280px;
            --slide-height: 720px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, sans-serif;
            background: #E5E7EB;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .slide {
            width: var(--slide-width);
            height: var(--slide-height);
            background: var(--background);
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.15);
        }

        /* 左侧深色边栏 - 瑞士风格的强几何元素 */
        .slide::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 120px;
            background: var(--primary);
        }

        /* 金色点缀线 */
        .slide::after {
            content: "";
            position: absolute;
            left: 120px;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--accent);
        }

        .content {
            position: absolute;
            left: 180px;
            right: 100px;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px 0;
        }

        .label {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 3px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        .title {
            font-size: 56px;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: 28px;
            max-width: 700px;
        }

        .subtitle {
            font-size: 20px;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 600px;
        }

        .footer {
            position: absolute;
            left: 180px;
            right: 100px;
            bottom: 60px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid #E5E7EB;
            padding-top: 24px;
        }

        .meta {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .meta strong {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* 左侧边栏内的装饰数字 */
        .sidebar-number {
            position: absolute;
            left: 30px;
            bottom: 60px;
            font-size: 72px;
            font-weight: 900;
            color: rgba(255,255,255,0.08);
            line-height: 1;
        }

        /* Hidden metadata for frontend */
        .preview-header { display: none; }
    </style>
</head>
<body>
    <div class="preview-header">
        <p>标签: 咨询研究/汇报</p>
        <div class="color-swatch" style="background-color: #0A1628">#0A1628</div>
        <div class="description">适用于政府汇报、咨询报告、研究课题等正式场合，深蓝商务风格，庄重专业</div>
    </div>

    <div class="slide">
        <div class="sidebar-number">01</div>

        <div class="content">
            <div class="label">演示文档</div>
            <h1 class="title">咨询研究/汇报</h1>
            <p class="subtitle">AI 智能生成的演示文稿预览 - 风格: 咨询研究风格</p>
        </div>

        <div class="footer">
            <div class="meta">
                <div><strong>汇报人</strong>　SlideCraft AI</div>
                <div><strong>日期</strong>　2026年1月</div>
            </div>
        </div>
    </div>
</body>
</html>
