<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政府公文 - Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8B1538;
            --accent: #C9A227;
            --text-primary: #1A1A1A;
            --text-secondary: #5C5C5C;
            --background: #FFFEF8;
            --slide-width: 1280px;
            --slide-height: 720px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: #E8E4DC;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .slide {
            width: var(--slide-width);
            height: var(--slide-height);
            background: var(--background);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }

        /* 顶部红色庄重横条 */
        .slide::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: var(--primary);
        }

        /* 底部金色装饰线 */
        .slide::after {
            content: "";
            position: absolute;
            bottom: 80px;
            left: 100px;
            right: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%);
        }

        .content {
            position: absolute;
            top: 60px;
            left: 100px;
            right: 100px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .emblem {
            width: 60px;
            height: 60px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        .emblem::before {
            content: "☆";
            font-size: 28px;
            color: var(--primary);
        }

        .title {
            font-family: 'Noto Serif SC', serif;
            font-size: 52px;
            font-weight: 900;
            color: var(--primary);
            line-height: 1.3;
            margin-bottom: 28px;
            letter-spacing: 8px;
        }

        .subtitle {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 18px;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.7;
            max-width: 600px;
        }

        .footer {
            position: absolute;
            left: 100px;
            right: 100px;
            bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 60px;
        }

        .footer-item {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Hidden metadata for frontend */
        .preview-header { display: none; }
    </style>
</head>
<body>
    <div class="preview-header">
        <p>标签: 政府公文</p>
        <div class="color-swatch" style="background-color: #8B1538">#8B1538</div>
        <div class="description">适用于政府机关、党政工作、公务汇报等正式场合，庄重严谨，规范标准</div>
    </div>

    <div class="slide">
        <div class="content">
            <div class="emblem"></div>
            <h1 class="title">政府公文</h1>
        </div>

        <div class="footer">
            <div class="footer-item">汇报人：SlideCraft AI</div>
            <div class="footer-item">日期：2026年1月</div>
        </div>
    </div>
</body>
</html>
