<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政府公文 - Preview</title>
    <style>
        :root {

    --primary: #C41E3A;
    --primary-light: #E53935;
    --primary-dark: #8B0000;
    --accent: #FFD700;
    --text-primary: #1A1A1A;
    --text-secondary: #4A4A4A;
    --text-light: #8A8A8A;
    --background: #FFFFFF;
    --background-alt: #FFF8F0;
    --border: #E0D5C5;
    --success: #00A86B;
    --warning: #FF9500;
    --error: #FF3B30;
    
    /* 兼容旧变量名 */
    --deep-blue: #C41E3A;
    --bright-blue: #E53935;
    --text-main: #1A1A1A;
    --text-sub: #4A4A4A;
    --bg-gray: #FFF8F0;
    --line-gray: #E0D5C5;


    --font-family: "SimSun", "宋体", "Microsoft YaHei", serif;
    --font-family-heading: "Microsoft YaHei", "微软雅黑", "SimHei", sans-serif;
    --font-family-mono: "Monaco", "Courier New", monospace;
    
    --size-cover-title: 52px;
    --size-page-title: 34px;
    --size-section-title: 44px;
    --size-heading: 22px;
    --size-body: 16px;
    --size-small: 12px;
    --size-footer: 14px;
    
    --line-height-heading: 1.3;
    --line-height-body: 1.6;
    
    --weight-normal: 400;
    --weight-bold: 700;


    --slide-width: 1280px;
    --slide-height: 720px;
    --padding-h: 50px;
    --padding-v: 40px;
    --gap-large: 40px;
    --gap-medium: 30px;
    --gap-small: 15px;
    --border-radius: 4px;

}


/* ============================================
   基础样式 - 政府公文风格
   ============================================ */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    font-family: var(--font-family);
    font-size: var(--size-body);
    line-height: var(--line-height-body);
    color: var(--text-primary);
    background: var(--background);
}

/* 全局列表样式重置 - 防止浏览器默认符号与自定义符号重复 */
ul, ol {
    list-style: none;
    margin: 0;
    padding: 0;
}

.slide-container {
    width: var(--slide-width);
    height: var(--slide-height);
    background: var(--background);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: var(--font-family);
    page-break-after: always;
}

/* 通用页脚 */
.slide-footer {
    height: 50px;
    padding: 0 var(--padding-h);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: var(--size-footer);
    color: var(--text-light);
    font-family: var(--font-family);
}

/* 内容区域 - 防溢出设计 */
.content-area {
    flex: 1;
    padding: var(--padding-v) var(--padding-h);
    display: flex;
    flex-direction: column;
    font-family: var(--font-family);
    overflow: hidden; /* 防溢出最后防线 */
    max-height: calc(var(--slide-height) - 50px); /* 扣除页脚高度 */
}

/* 标题区域 */
.title-box {
    margin-bottom: var(--gap-medium);
}

.page-title {
    font-size: var(--size-page-title);
    color: var(--primary);
    line-height: var(--line-height-heading);
    font-weight: var(--weight-bold);
    font-family: var(--font-family-heading);
}

/* 标题排版优化 - 防止单字换行 */
h1, h2, h3, h4, 
.main-title, .sub-title, 
.page-title, .section-title, 
.closing-title {
    text-wrap: balance;
    word-break: break-word;
}


/* ============================================
   封面页样式 (Government)
   ============================================ */
.cover-slide {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 100px;
    position: relative;
    background: #fff;
    text-align: center;
}

.cover-slide::before {
    content: "";
    position: absolute;
    top: 80px; left: 0; right: 0;
    height: 3px;
    background: #DD2C00;
    margin: 0 60px;
}

.cover-slide::after {
    content: "";
    position: absolute;
    bottom: 60px; left: 0; right: 0;
    height: 1px;
    background: #DD2C00;
    margin: 0 60px;
    opacity: 0.5;
}

.cover-top {
    margin-top: 60px;
    width: 100%;
    border-bottom: 1px solid #DD2C00;
    padding-bottom: 40px;
    margin-bottom: 60px;
}

.brand-line { display: none; }

.doc-type {
    font-size: 36px;
    color: #DD2C00;
    font-family: serif;
    font-weight: 900;
    letter-spacing: 8px;
}

.main-title {
    font-size: 52px;
    line-height: 1.4;
    color: #000;
    font-family: sans-serif;
    margin-bottom: 40px;
}

.sub-title {
    font-size: 26px;
    color: #333;
    font-family: serif;
}

.cover-bottom {
    margin-top: auto;
    width: 100%;
    text-align: right;
    padding-right: 20px;
}

.footer-item {
    font-size: 20px;
    color: #000;
    font-family: serif;
    margin-bottom: 12px;
}


/* ============================================
   章节过场页样式 (Government)
   ============================================ */

.section-slide {
    background: #DD2C00; /* 全红背景 */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 100px;
    color: white;
    text-align: center;
}

.section-border {
    position: absolute;
    top: 20px; left: 20px; right: 20px; bottom: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    pointer-events: none;
}

.section-number {
    font-size: 60px;
    font-family: "PingFang SC", serif;
    color: rgba(255,255,255,0.9);
    margin-bottom: 30px;
    border-bottom: 1px solid rgba(255,255,255,0.5);
    padding-bottom: 10px;
    display: inline-block;
}

.section-title {
    font-size: 56px;
    font-family: "SimHei", sans-serif;
    margin-bottom: 30px;
    font-weight: normal;
    letter-spacing: 2px;
}

.section-desc {
    font-size: 24px;
    font-family: "KaiTi", serif;
    opacity: 0.9;
}

.section-line { display: none; }


/* ============================================
   正文页样式
   ============================================ */

/* 布局容器 - 防溢出 */
.layout-box {
    flex: 1;
    display: flex;
    gap: var(--gap-large);
    overflow: hidden; /* 裁剪溢出内容 */
    min-height: 0; /* 允许flex收缩 */
}

.two-col > .col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0; /* 允许收缩 */
    overflow: hidden;
}

.three-col > .col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
}

/* 子标题 */
.sub-head {
    font-size: var(--size-heading);
    color: var(--primary);
    margin-bottom: 20px;
    border-left: 6px solid var(--primary-light);
    padding-left: 15px;
    line-height: 1;
    font-family: var(--font-family-heading);
    font-weight: var(--weight-bold);
}

/* 列表 */
.big-list {
    list-style: none;
}

.big-list li {
    font-size: var(--size-body);
    color: var(--text-primary);
    line-height: var(--line-height-body);
    margin-bottom: 20px;
    position: relative;
    padding-left: 30px;
    font-family: var(--font-family);
}

.big-list li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 10px;
    width: 10px;
    height: 10px;
    background: var(--primary-light);
    border-radius: 2px;
}

/* 数据卡片 */
.data-card {
    background: var(--background-alt);
    padding: 20px 25px;
    border-top: 4px solid var(--primary-light);
    border-radius: var(--border-radius);
    flex-shrink: 0;
}

.data-val {
    font-size: 48px;
    color: var(--primary);
    font-weight: var(--weight-bold);
    margin-bottom: 8px;
    font-family: var(--font-family-heading);
    line-height: 1;
}

.data-lbl {
    font-size: var(--size-small);
    color: var(--text-secondary);
    font-family: var(--font-family);
}

/* 底部结论框 */
.bottom-box {
    margin-top: auto;
    background: var(--background-alt);
    padding: 20px 25px;
    border-left: 8px solid var(--primary);
    border-radius: var(--border-radius);
    flex-shrink: 0;
}

.bottom-text {
    font-size: 22px;
    color: var(--primary);
    font-weight: var(--weight-bold);
    line-height: 1.5;
    font-family: var(--font-family);
}

/* 文本块 */
.text-block {
    margin-bottom: var(--gap-medium);
}

/* 引用块 */
.quote-block {
    border-left: 4px solid var(--primary-light);
    padding-left: 20px;
    font-style: italic;
    color: var(--text-secondary);
}


/* ============================================
   目录页样式
   ============================================ */

.catalog-list {
    display: flex;
    flex-direction: column;
    gap: var(--gap-medium);
}

.catalog-item {
    display: flex;
    align-items: flex-start;
    gap: 30px;
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
}

.catalog-item:last-child {
    border-bottom: none;
}

.catalog-idx {
    font-size: 48px;
    font-weight: var(--weight-bold);
    color: var(--primary-light);
    opacity: 0.3;
    line-height: 1;
    min-width: 80px;
    font-family: var(--font-family-heading);
}

.catalog-content {
    flex: 1;
}

.catalog-name {
    font-size: var(--size-heading);
    color: var(--primary);
    font-weight: var(--weight-bold);
    margin-bottom: 8px;
    font-family: var(--font-family-heading);
}

.catalog-desc {
    font-size: var(--size-body);
    color: var(--text-secondary);
    font-family: var(--font-family);
}


/* ============================================
   封底页样式
   ============================================ */

.closing-slide {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 80px;
    background: var(--background);
}

.closing-title {
    font-size: 56px;
    color: var(--primary);
    font-weight: var(--weight-bold);
    margin-bottom: 40px;
    letter-spacing: 20px;
    font-family: var(--font-family-heading);
}

.closing-contact {
    font-size: var(--size-body);
    color: var(--text-secondary);
    line-height: 2;
    font-family: var(--font-family);
}


/* ============================================
   通用组件样式
   ============================================ */

/* 表格 */
.clean-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 18px;
    font-family: var(--font-family);
}

.clean-table th {
    text-align: left;
    padding: 15px;
    background: var(--background-alt);
    color: var(--primary);
    border-bottom: 2px solid var(--primary);
    font-family: var(--font-family);
    font-weight: var(--weight-bold);
}

.clean-table td {
    padding: 15px;
    border-bottom: 1px solid var(--border);
    color: var(--text-primary);
    font-family: var(--font-family);
}

.clean-table tr:hover td {
    background: var(--background-alt);
}

/* 指标堆叠 */
.metric-stack {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: var(--gap-medium);
}

.metric-item {
    text-align: center;
    padding: 20px;
    background: var(--background-alt);
    border-radius: var(--border-radius);
}

.metric-value {
    font-size: 36px;
    font-weight: var(--weight-bold);
    color: var(--primary);
    margin-bottom: 8px;
}

.metric-label {
    font-size: var(--size-small);
    color: var(--text-secondary);
}

/* 高亮框 */
.highlight-box {
    background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
    color: white;
    padding: 20px 30px;
    border-radius: var(--border-radius);
    font-weight: var(--weight-bold);
}

/* 标签 */
.tag {
    display: inline-block;
    padding: 4px 12px;
    background: var(--background-alt);
    color: var(--primary);
    border-radius: 20px;
    font-size: var(--size-small);
    margin-right: 8px;
    margin-bottom: 8px;
}

/* 进度条 */
.progress-bar {
    height: 8px;
    background: var(--background-alt);
    border-radius: 4px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary-light) 0%, var(--primary) 100%);
    border-radius: 4px;
}

/* 时间线 */
.timeline {
    position: relative;
    padding-left: 30px;
}

.timeline::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--border);
}

.timeline-item {
    position: relative;
    margin-bottom: 30px;
}

.timeline-item::before {
    content: "";
    position: absolute;
    left: -34px;
    top: 5px;
    width: 10px;
    height: 10px;
    background: var(--primary-light);
    border-radius: 50%;
}

.timeline-date {
    font-size: var(--size-small);
    color: var(--text-light);
    margin-bottom: 5px;
}

.timeline-content {
    font-size: var(--size-body);
    color: var(--text-primary);
}


/* ============================================
   图表样式
   ============================================ */

.chart-container {
    width: 100%;
    max-height: 350px; /* 限制最大高度，防溢出 */
    min-height: 200px;
    position: relative;
    background: #fff;
    border-radius: 8px;
    padding: 10px;
    flex-shrink: 0;
}

.chart-container > div {
    width: 100% !important;
    height: 100% !important;
}

.chart-title {
    font-size: var(--size-heading);
    color: var(--primary);
    text-align: center;
    margin-bottom: var(--gap-small);
    font-weight: var(--weight-bold);
}

.chart-subtitle {
    font-size: var(--size-small);
    color: var(--text-secondary);
    text-align: center;
    margin-bottom: var(--gap-medium);
}


/* ============================================
   打印优化
   ============================================ */

@media print {
    .slide-container {
        break-inside: avoid;
        page-break-after: always;
    }
    
    .section-slide {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
    
    .data-card,
    .bottom-box,
    .highlight-box {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
}

@page {
    size: 1280px 720px;
    margin: 0;
}
