<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年终述职/总结 - Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1A365D;
            --accent: #ED8936;
            --text-primary: #1A202C;
            --text-secondary: #718096;
            --background: #FFFFFF;
            --slide-width: 1280px;
            --slide-height: 720px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, sans-serif;
            background: #EDF2F7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .slide {
            width: var(--slide-width);
            height: var(--slide-height);
            background: var(--background);
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.12);
        }

        /* 顶部渐变色条 - 年终述职的进取感 */
        .slide::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
        }

        /* 右侧装饰数字 */
        .year-badge {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 200px;
            font-weight: 900;
            color: rgba(26, 54, 93, 0.04);
            line-height: 1;
            letter-spacing: -10px;
        }

        .content {
            position: absolute;
            left: 100px;
            right: 400px;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px 0;
        }

        .label {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 32px;
        }

        .label::before {
            content: "";
            width: 40px;
            height: 2px;
            background: var(--accent);
        }

        .title {
            font-size: 54px;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.2;
            letter-spacing: -1px;
            margin-bottom: 24px;
        }

        .subtitle {
            font-size: 19px;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.7;
            max-width: 500px;
        }

        .footer {
            position: absolute;
            left: 100px;
            right: 100px;
            bottom: 56px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #E2E8F0;
            padding-top: 20px;
        }

        .meta {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            gap: 32px;
        }

        /* Hidden metadata for frontend */
        .preview-header { display: none; }
    </style>
</head>
<body>
    <div class="preview-header">
        <p>标签: 年终述职/总结</p>
        <div class="color-swatch" style="background-color: #1A365D">#1A365D</div>
        <div class="description">适用于年度工作总结、个人述职、团队汇报等场合，专业务实，数据驱动</div>
    </div>

    <div class="slide">
        <div class="year-badge">26</div>

        <div class="content">
            <div class="label">演示文档</div>
            <h1 class="title">年终述职/总结</h1>
            <p class="subtitle">AI 智能生成的演示文稿预览 - 风格: 年终述职风格</p>
        </div>

        <div class="footer">
            <div class="meta">
                <span>汇报人：SlideCraft AI</span>
                <span>日期：2026年1月</span>
            </div>
        </div>
    </div>
</body>
</html>
