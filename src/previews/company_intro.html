<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司/项目介绍 - Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0A0A0A;
            --accent: #00D4FF;
            --text-primary: #0A0A0A;
            --text-secondary: #6B6B6B;
            --background: #FFFFFF;
            --slide-width: 1280px;
            --slide-height: 720px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, sans-serif;
            background: #F0F0F0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .slide {
            width: var(--slide-width);
            height: var(--slide-height);
            background: var(--background);
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 100px rgba(0,0,0,0.15);
        }

        /* 左下角几何装饰 */
        .geo-shape {
            position: absolute;
            bottom: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
            border: 60px solid rgba(0, 212, 255, 0.1);
            border-radius: 50%;
        }

        /* 右上角点阵装饰 */
        .dot-pattern {
            position: absolute;
            top: 60px;
            right: 80px;
            display: grid;
            grid-template-columns: repeat(5, 8px);
            gap: 12px;
        }

        .dot-pattern span {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.6;
        }

        .content {
            position: absolute;
            left: 100px;
            right: 100px;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .title {
            font-size: 64px;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.1;
            letter-spacing: -2px;
            margin-bottom: 24px;
        }

        .title span {
            color: var(--accent);
        }

        .subtitle {
            font-size: 20px;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 600px;
        }

        .footer {
            position: absolute;
            left: 100px;
            right: 100px;
            bottom: 56px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .meta {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            gap: 32px;
        }

        .brand {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 2px;
        }

        /* Hidden metadata for frontend */
        .preview-header { display: none; }
    </style>
</head>
<body>
    <div class="preview-header">
        <p>标签: 公司/项目介绍</p>
        <div class="color-swatch" style="background-color: #0A0A0A">#0A0A0A</div>
        <div class="description">适用于企业介绍、产品发布、项目路演等商业场合，现代科技感，简洁有力</div>
    </div>

    <div class="slide">
        <div class="geo-shape"></div>
        <div class="dot-pattern">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
        </div>

        <div class="content">
            <div class="label">演示文档</div>
            <h1 class="title">公司<span>/</span>项目介绍</h1>
            <p class="subtitle">AI 智能生成的演示文稿预览 - 风格: 公司介绍风格</p>
        </div>

        <div class="footer">
            <div class="meta">
                <span>汇报人：SlideCraft AI</span>
                <span>日期：2026年1月</span>
            </div>
            <div class="brand">SLIDECRAFT.AI</div>
        </div>
    </div>
</body>
</html>
