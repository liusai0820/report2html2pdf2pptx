name: Keep Render App Awake

on:
  schedule:
    # 每 10 分钟运行一次 (Render 免费版通常 15 分钟无请求会休眠)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 支持手动触发测试

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          # 请将下方链接替换为您真实的 Render 后端地址
          URL="https://slidecraft-backend.onrender.com/api/health"
          echo "Pinging $URL..."
          curl -s -f $URL || echo "Ping failed (maybe app is starting up or URL is wrong)"

      - name: Ping Frontend (Optional)
        run: |
          # 如果前端也是 Web Service 而不是 Static Site，也需要 Ping
          URL="https://slidecraft-frontend.onrender.com"
          echo "Pinging $URL..."
          curl -s -f $URL || echo "Ping failed"
