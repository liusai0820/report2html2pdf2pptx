services:
  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-presentation-backend
    environment:
      - PYTHONUNBUFFERED=1
      - API_HOST=0.0.0.0
      - API_PORT=8005
      - PYTHONPATH=/app/src
      - UVICORN_WORKERS=4
      - COMFYUI_HOST=host.docker.internal:8188
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - config/.env
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./config:/app/config
      - ./src:/app/src
    networks:
      - app-network
    restart: always

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: ai-presentation-frontend
    networks:
      - app-network
    restart: always

  # Nginx 网关 - 统一路由
  gateway:
    image: nginx:alpine
    container_name: ai-presentation-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    restart: always

  # Cloudflare Tunnel - 只需指向 gateway
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel --protocol http2 run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - app-network
    depends_on:
      - gateway

networks:
  app-network:
    driver: bridge
