services:
  # 后端服务 - 生产版本 (无源码挂载)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-presentation-backend-prod
    ports:
      - "8005:8005"
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - COMFYUI_ENABLED=true
      - COMFYUI_HOST=host.docker.internal:8188
      - API_HOST=0.0.0.0
      - API_PORT=8005
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - PYTHONPATH=/app/src
      - UVICORN_WORKERS=4
    env_file:
      - config/.env
    volumes:
      # 只挂载数据目录，不挂载 src 代码目录！
      - ./input:/app/input
      - ./output:/app/output
      - ./config:/app/config
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 32G
        reservations:
          cpus: '4'
          memory: 8G
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8005/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://ppt.gwy.life/api}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: ai-presentation-frontend-prod
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
